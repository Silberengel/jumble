services:
  jumble:
    container_name: imwald-jumble
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PROXY_SERVER: ${JUMBLE_PROXY_SERVER_URL:-http://localhost:8090}
    ports:
      - "8089:80"
    restart: unless-stopped
    networks:
      - jumble

  og-proxy:
    image: ${OG_PROXY_IMAGE:-silberengel/wikistr:latest-og-proxy}
    container_name: jumble-og-proxy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '127.0.0.1:8090:8090'
    environment:
      PROXY_PORT: '8090'
      PROXY_ALLOW_ORIGIN: ${OG_PROXY_ALLOW_ORIGIN:-http://localhost:5173}
      PROXY_TIMEOUT_MS: '30000'
      PROXY_MAX_BODY_BYTES: '5242880'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    networks:
      - jumble
    restart: unless-stopped

  # Optional: same as docker-compose.dev.yml — `docker compose --profile editor-tools up -d languagetool libretranslate`
  languagetool:
    image: silviof/docker-languagetool:latest
    profiles: ['editor-tools']
    container_name: jumble-languagetool
    ports:
      - '8010:8010'
    networks:
      - jumble
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ['editor-tools']
    container_name: jumble-libretranslate
    ports:
      - '5000:5000'
    tty: true
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,de,es,fr,it,pt,ru,zh,ja,ar}
      LT_UPDATE_MODELS: ${LT_UPDATE_MODELS:-true}
    volumes:
      - ./.local-libretranslate/share:/home/libretranslate/.local/share
      - ./.local-libretranslate/cache:/home/libretranslate/.local/cache
    networks:
      - jumble
    restart: unless-stopped

networks:
  jumble:
